# Decipherment for grid video (phase 3, steps 1 and 2). The pilot's frozen settings
# (configs/pilot-decipher.yaml), with:
# - word kinds found from the language alone (align.words), not the pilot's grammar rules;
# - frame structure found from the frames alone (align.units; automatic for grid video);
# - screening: the 24 matchings closest by raw counts each get a short fit (128 episodes, 4
#   iterations), and the 6 that best explain the selection episodes get the full fit. Matchings
#   that differ only in the agents' order have identical counts, so they are screened together.
lang_model: lang-ps
frame_model: obs-joint
train_episodes: 512
select_episodes: 128
score_episodes: 300
batch: 64
max_sentences: 100
sentence_tokens: 6
particles: 32
candidates: 4
iterations: 12
own_prior: 20.0
smooth: 0.01
summary_power: 0.2
summary_features: linear
emission: sentence
summary_from: 5
freeze_mixture: 8
update_paths: 8
shortlist: 6
screen: 24
screen_episodes: 128
screen_iterations: 4
word_kinds: classes
# Entries 62-63: place and appearance as one unit; candidates that break the frames' structure excluded.
grid_units: joint
valid_only: true
