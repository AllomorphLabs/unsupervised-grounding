# Model and training settings for the pilot (technical decision 13).
# The context length is set from the longest episode in each pair's data.
model:
  layers: 4
  width: 128
  heads: 4
  dropout: 0.0
  joint: true  # frame model only: whole next frames (technical decision 18)
  joint_hidden: 256
train:
  steps: 20000
  batch_size: 32
  lr: 0.0003
  warmup: 200
  weight_decay: 0.1
  eval_every: 500
  max_minutes: 10
