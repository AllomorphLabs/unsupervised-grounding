# Frame model for grid video (phase 3, step 1). As configs/pilot-models.yaml, but a grid frame has
# 240 values against the state vector's 45, so the joint head is wider (about four hidden units per
# value, as 256 gave for 45) and training gets more time.
model:
  layers: 4
  width: 128
  heads: 4
  dropout: 0.0
  joint: true
  joint_hidden: 1024
train:
  steps: 20000
  batch_size: 32
  lr: 0.0003
  warmup: 200
  weight_decay: 0.1
  eval_every: 500
  max_minutes: 25
