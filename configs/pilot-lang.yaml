# Language model settings for the pilot (technical decisions 15 and 17).
# The frame model keeps configs/pilot-models.yaml (decision 13).
# The context length is set from the longest episode in each pair's data.
model:
  layers: 6
  width: 256
  heads: 8
  dropout: 0.0
  future: 48  # predictive-state head: the summary predicts the next 48 tokens (decision 17)
  summary: 64
  future_layers: 2
train:
  steps: 150000
  batch_size: 32
  lr: 0.001
  warmup: 1000
  weight_decay: 0.1
  eval_every: 2000
  max_minutes: 60
  amp: true
