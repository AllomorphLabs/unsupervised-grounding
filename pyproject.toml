[project]
name = "grounding"
version = "0.0.0"
description = "Predicting the Limits of Unsupervised Grounding"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "numpy>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grounding"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets test files in different folders share a name (tests/x/test_a.py, tests/y/test_a.py).
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
