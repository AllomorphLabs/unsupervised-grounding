[project]
name = "grounding"
version = "0.0.0"
description = "Predicting the Limits of Unsupervised Grounding"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "numpy>=2.5",
    "pyyaml>=6.0.4",
    "torch>=2.15",
    "wordfreq>=3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.12",
]
glosses = [
    "wn>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grounding"]

# PyTorch: the CUDA 13.4 build on Windows (the workstation GPU), the CPU build on Linux (CI).
# Revisit when training moves to a Linux GPU machine.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu134", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu134"
url = "https://download.pytorch.org/whl/cu134"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets test files in different folders share a name (tests/x/test_a.py, tests/y/test_a.py).
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
